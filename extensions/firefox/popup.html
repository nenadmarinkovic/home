<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Save to website</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>Save link</h1>
    <p id="url" class="url"></p>

    <div class="field">
      <label for="title">Title</label>
      <input id="title" type="text" autocomplete="off" />
    </div>

    <div class="field">
      <div class="field-head">
        <label for="description">Description</label>
        <button id="summarize" class="ghost-orange" type="button">
          <span class="wand" aria-hidden>✦</span>
          <span id="summarize-label">Summarize</span>
        </button>
      </div>
      <textarea
        id="description"
        rows="3"
        autocomplete="off"
        placeholder="Optional — or hit Summarize to let AI draft 3 sentences."
      ></textarea>
    </div>

    <div class="field">
      <label>Tags</label>
      <div id="tags" class="tags"></div>
    </div>

    <div class="row actions">
      <button id="cancel">Cancel</button>
      <button id="save" class="primary">Save</button>
    </div>

    <p id="status" class="status"></p>

    <script src="popup.js"></script>
  </body>
</html>
